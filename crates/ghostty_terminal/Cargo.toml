[package]
name = "ghostty_terminal"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "A terminal pane backed by Ghostty (libghostty on macOS, libghostty-vt on Linux)"

[lints]
workspace = true

[lib]
path = "src/ghostty_terminal.rs"
doctest = false

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
ui_prompt.workspace = true
log.workspace = true
parking_lot.workspace = true
ui.workspace = true
workspace.workspace = true
util.workspace = true
picker.workspace = true
fuzzy.workspace = true
project.workspace = true
paths.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
smallvec.workspace = true
image.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa.workspace = true
core-foundation.workspace = true
core-video.workspace = true
ghostty_embed.workspace = true
gpui_macos.workspace = true
objc.workspace = true
raw-window-handle = "0.6"
block = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ghostty_vt_sys.workspace = true
portable-pty.workspace = true
resvg = { version = "0.45.0", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
serde_json.workspace = true
paths.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
image.workspace = true
cocoa.workspace = true
objc.workspace = true
raw-window-handle = "0.6"
